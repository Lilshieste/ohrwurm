<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ohrwurm</title>
</head>
<body>
  <h1>Ohrwurm</h1>
  <p>Steel Thread: plays a hardcoded NSF file, using existing NSF player code. I'll incrementally hook up my emulator as I hit critical milestones...</p>

  <div id="file-picker" style="margin-bottom: 1em;">
    <label for="nsf-file"><strong>Load NSF:</strong></label>
    <input type="file" id="nsf-file" accept=".nsf">
  </div>

  <div id="metadata">
    <p><strong>Title:</strong> <span id="title">-</span></p>
    <p><strong>Artist:</strong> <span id="artist">-</span></p>
    <p><strong>Songs:</strong> <span id="songs">-</span></p>
  </div>

  <button id="play">Play (libgme)</button>
  <button id="stop">Stop</button>

  <hr>
  <h3>Emulator (Steel Thread)</h3>
  <div id="playback-controls">
    <button id="prev-song">⏮ Prev</button>
    <button id="play-pause">▶ Play</button>
    <button id="next-song">Next ⏭</button>
    <span id="song-display" style="margin-left: 1em; font-family: monospace;">Song 1 / -</span>
  </div>

  <div id="channel-controls" style="margin-top: 1em;">
    <strong>Channels:</strong>
    <label><input type="checkbox" data-channel="pulse1" checked> Pulse 1</label>
    <label><input type="checkbox" data-channel="pulse2" checked> Pulse 2</label>
    <label><input type="checkbox" data-channel="triangle" checked> Triangle</label>
    <label><input type="checkbox" data-channel="noise" checked> Noise</label>
    <label><input type="checkbox" data-channel="dmc" checked disabled> DMC</label>
  </div>

  <div id="emulator-status" style="margin-top: 1em; font-family: monospace;"></div>

  <hr>
  <h3>Emulator V2 (Demand-Driven Audio)</h3>
  <div id="v2-playback-controls">
    <button id="v2-prev-song">⏮ Prev</button>
    <button id="v2-play-pause">▶ Play</button>
    <button id="v2-next-song">Next ⏭</button>
    <span id="v2-song-display" style="margin-left: 1em; font-family: monospace;">Song 1 / -</span>
  </div>

  <div id="v2-channel-controls" style="margin-top: 1em;">
    <strong>Channels:</strong>
    <label><input type="checkbox" data-channel="pulse1" checked> Pulse 1</label>
    <label><input type="checkbox" data-channel="pulse2" checked> Pulse 2</label>
    <label><input type="checkbox" data-channel="triangle" checked> Triangle</label>
    <label><input type="checkbox" data-channel="noise" checked> Noise</label>
    <label><input type="checkbox" data-channel="dmc" checked disabled> DMC</label>
  </div>

  <div id="v2-status" style="margin-top: 1em; font-family: monospace;"></div>

  <script src="bundle.js"></script>
  <script src="external_lib/libgme.js"></script>
  <script src="external_lib/nsf-player.js"></script>
  <script>
    let currentNsfUrl = 'music.nsf';
    let currentSong = 0;
    let totalSongs = 1;
    const nsfPlayer = createNsfPlayer();
    const player = createPlayer();
    const statusEl = document.getElementById('emulator-status');
    const playPauseBtn = document.getElementById('play-pause');
    const songDisplay = document.getElementById('song-display');

    const updateSongDisplay = () => {
      songDisplay.textContent = `Song ${currentSong + 1} / ${totalSongs}`;
    };

    const updateMetadata = (metadata) => {
      document.getElementById('title').textContent = metadata.title;
      document.getElementById('artist').textContent = metadata.artist;
      document.getElementById('songs').textContent = metadata.totalSongs;
      totalSongs = metadata.totalSongs;
      currentSong = 0;
      updateSongDisplay();
    };

    // Load default file on startup
    player.loadFile(currentNsfUrl).then(updateMetadata);

    // File picker handler
    document.getElementById('nsf-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Stop any current playback
      stopPlayback();
      nsfPlayer.stop();

      // Create object URL and load
      currentNsfUrl = URL.createObjectURL(file);
      try {
        const metadata = await player.loadFile(currentNsfUrl);
        updateMetadata(metadata);
        statusEl.textContent = `Loaded: ${file.name}`;
      } catch (err) {
        statusEl.textContent = `Error loading file: ${err.message}`;
      }
    });

    document.getElementById('play').addEventListener('click', () => {
      nsfPlayer.play(currentNsfUrl, 0);
    });

    document.getElementById('stop').addEventListener('click', () => {
      nsfPlayer.stop();
    });

    const startPlayback = () => {
      statusEl.textContent = 'Starting emulator...';
      try {
        player.runInit(currentSong);

        // Apply current checkbox states to the player
        document.querySelectorAll('#channel-controls input[data-channel]').forEach(checkbox => {
          const channel = checkbox.dataset.channel;
          const muted = !checkbox.checked;
          player.setChannelMute(channel, muted);
        });

        player.startPlayLoop();
        playPauseBtn.textContent = '⏸ Pause';
        statusEl.textContent = '♪ Playing via emulator';
      } catch (err) {
        statusEl.textContent = '✗ Error: ' + err.message;
        console.error(err);
      }
    };

    const stopPlayback = () => {
      player.stopPlayLoop();
      playPauseBtn.textContent = '▶ Play';
      statusEl.textContent = 'Stopped.';
    };

    document.getElementById('play-pause').addEventListener('click', () => {
      if (player.isPlaying()) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    document.getElementById('prev-song').addEventListener('click', () => {
      if (currentSong > 0) {
        currentSong--;
        updateSongDisplay();
        if (player.isPlaying()) {
          stopPlayback();
          startPlayback();
        }
      }
    });

    document.getElementById('next-song').addEventListener('click', () => {
      if (currentSong < totalSongs - 1) {
        currentSong++;
        updateSongDisplay();
        if (player.isPlaying()) {
          stopPlayback();
          startPlayback();
        }
      }
    });

    // Channel mute controls
    document.querySelectorAll('#channel-controls input[data-channel]').forEach(checkbox => {
      checkbox.addEventListener('change', (e) => {
        const channel = e.target.dataset.channel;
        const muted = !e.target.checked;
        player.setChannelMute(channel, muted);
      });
    });

    // ========== V2 Player (Demand-Driven Audio) ==========
    const playerV2 = createPlayerV2();
    let v2CurrentSong = 0;
    let v2TotalSongs = 1;
    const v2StatusEl = document.getElementById('v2-status');
    const v2PlayPauseBtn = document.getElementById('v2-play-pause');
    const v2SongDisplay = document.getElementById('v2-song-display');

    const updateV2SongDisplay = () => {
      v2SongDisplay.textContent = `Song ${v2CurrentSong + 1} / ${v2TotalSongs}`;
    };

    const loadV2Player = async (url) => {
      try {
        const metadata = await playerV2.loadFile(url);
        v2TotalSongs = metadata.totalSongs;
        v2CurrentSong = 0;
        updateV2SongDisplay();
        v2StatusEl.textContent = 'V2 loaded and ready.';
      } catch (err) {
        v2StatusEl.textContent = `V2 Error: ${err.message}`;
      }
    };

    // Load default file for V2 on startup
    loadV2Player(currentNsfUrl);

    // Update V2 when file picker changes
    document.getElementById('nsf-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      // V2 will reload when file changes (URL already updated by V1 handler)
      // Small delay to ensure URL is set
      setTimeout(() => loadV2Player(currentNsfUrl), 100);
    });

    const startV2Playback = () => {
      v2StatusEl.textContent = 'Starting V2 emulator...';
      try {
        playerV2.selectSong(v2CurrentSong);

        // Apply current checkbox states
        document.querySelectorAll('#v2-channel-controls input[data-channel]').forEach(checkbox => {
          const channel = checkbox.dataset.channel;
          const muted = !checkbox.checked;
          playerV2.setChannelMute(channel, muted);
        });

        playerV2.play();
        v2PlayPauseBtn.textContent = '⏸ Pause';
        v2StatusEl.textContent = '♪ Playing via V2 (demand-driven)';
      } catch (err) {
        v2StatusEl.textContent = '✗ V2 Error: ' + err.message;
        console.error(err);
      }
    };

    const stopV2Playback = () => {
      playerV2.stop();
      v2PlayPauseBtn.textContent = '▶ Play';
      v2StatusEl.textContent = 'V2 Stopped.';
    };

    document.getElementById('v2-play-pause').addEventListener('click', () => {
      if (playerV2.isPlaying()) {
        stopV2Playback();
      } else {
        startV2Playback();
      }
    });

    document.getElementById('v2-prev-song').addEventListener('click', () => {
      if (v2CurrentSong > 0) {
        v2CurrentSong--;
        updateV2SongDisplay();
        if (playerV2.isPlaying()) {
          playerV2.selectSong(v2CurrentSong);
          v2StatusEl.textContent = `♪ Playing song ${v2CurrentSong + 1} via V2`;
        }
      }
    });

    document.getElementById('v2-next-song').addEventListener('click', () => {
      if (v2CurrentSong < v2TotalSongs - 1) {
        v2CurrentSong++;
        updateV2SongDisplay();
        if (playerV2.isPlaying()) {
          playerV2.selectSong(v2CurrentSong);
          v2StatusEl.textContent = `♪ Playing song ${v2CurrentSong + 1} via V2`;
        }
      }
    });

    // V2 Channel mute controls
    document.querySelectorAll('#v2-channel-controls input[data-channel]').forEach(checkbox => {
      checkbox.addEventListener('change', (e) => {
        const channel = e.target.dataset.channel;
        const muted = !e.target.checked;
        playerV2.setChannelMute(channel, muted);
      });
    });
  </script>
</body>
</html>
