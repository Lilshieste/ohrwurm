<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ohrwurm</title>
</head>
<body>
  <h1>Ohrwurm</h1>
  <p>Steel Thread: plays a hardcoded NSF file, using existing NSF player code. I'll incrementally hook up my emulator as I hit critical milestones...</p>

  <div id="metadata">
    <p><strong>Title:</strong> <span id="title">-</span></p>
    <p><strong>Artist:</strong> <span id="artist">-</span></p>
    <p><strong>Songs:</strong> <span id="songs">-</span></p>
  </div>

  <button id="play">Play (libgme)</button>
  <button id="stop">Stop</button>

  <hr>
  <h3>Emulator (Steel Thread)</h3>
  <button id="play-emulator">Play (Emulator)</button>
  <button id="stop-emulator">Stop (Emulator)</button>

  <div id="channel-controls" style="margin-top: 1em;">
    <strong>Channels:</strong>
    <label><input type="checkbox" data-channel="pulse1" checked> Pulse 1</label>
    <label><input type="checkbox" data-channel="pulse2" checked> Pulse 2</label>
    <label><input type="checkbox" data-channel="triangle" checked> Triangle</label>
    <label><input type="checkbox" data-channel="noise" checked> Noise</label>
    <label><input type="checkbox" data-channel="dmc" checked disabled> DMC</label>
  </div>

  <div id="emulator-status" style="margin-top: 1em; font-family: monospace;"></div>

  <script src="bundle.js"></script>
  <script src="external_lib/libgme.js"></script>
  <script src="external_lib/nsf-player.js"></script>
  <script>
    const nsfFile = 'music.nsf';
    const nsfPlayer = createNsfPlayer();
    const player = createPlayer();
    const statusEl = document.getElementById('emulator-status');

    // Load metadata using our parser
    player.loadFile(nsfFile).then((metadata) => {
      document.getElementById('title').textContent = metadata.title;
      document.getElementById('artist').textContent = metadata.artist;
      document.getElementById('songs').textContent = metadata.totalSongs;
    });

    document.getElementById('play').addEventListener('click', () => {
      nsfPlayer.play(nsfFile, 0);
    });

    document.getElementById('stop').addEventListener('click', () => {
      nsfPlayer.stop();
    });

    document.getElementById('play-emulator').addEventListener('click', () => {
      statusEl.textContent = 'Starting emulator...';
      try {
        player.runInit();

        // Apply current checkbox states to the player
        document.querySelectorAll('#channel-controls input[data-channel]').forEach(checkbox => {
          const channel = checkbox.dataset.channel;
          const muted = !checkbox.checked;
          player.setChannelMute(channel, muted);
        });

        player.startPlayLoop();
        statusEl.textContent = '♪ Playing via emulator';
      } catch (err) {
        statusEl.textContent = '✗ Error: ' + err.message;
        console.error(err);
      }
    });

    document.getElementById('stop-emulator').addEventListener('click', () => {
      player.stopPlayLoop();
      statusEl.textContent = 'Emulator stopped.';
    });

    // Channel mute controls
    document.querySelectorAll('#channel-controls input[data-channel]').forEach(checkbox => {
      checkbox.addEventListener('change', (e) => {
        const channel = e.target.dataset.channel;
        const muted = !e.target.checked;
        player.setChannelMute(channel, muted);
      });
    });
  </script>
</body>
</html>
